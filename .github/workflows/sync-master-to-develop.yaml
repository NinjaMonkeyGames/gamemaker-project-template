# Whenever master changes for any reason (a release/* merge, a hotfix/*
# merge, semantic-release's version-bump commit, or anything else), this
# opens a pull request bringing those changes into develop - so develop
# can't silently drift behind what's actually shipped, and nobody has to
# remember a manual "merge back into develop" step.
#
# This only ever opens the PR - it never merges it. A human still
# reviews and merges, same as everywhere else in this repo. Once a sync
# PR is open, there's nothing to "update" on later pushes to master: an
# open PR tracks the live diff between its base and head branches
# automatically (that's just how GitHub PRs work), so the existing PR
# already reflects new commits without this workflow touching it again.
#
# This only ever syncs master into develop. release/* and hotfix/*
# branches can't be brought into sync the same way: check-source-branch's
# whitelist rejects any PR merging INTO a release/*/hotfix/* branch, since
# those branches only ever merge OUT (to master). Keeping an in-flight
# release/* or hotfix/* branch current with master is a manual step -
# push the needed commit directly onto the branch, no PR - see
# CONTRIBUTING.md's hotfix section.
#
# Merge this PR with a regular merge commit, not squash - same reasoning
# as release/* and hotfix/* merging back into develop (see
# CONTRIBUTING.md): this preserves history rather than collapsing it.
#
# For the PR's title+body to actually be what lands in develop's history,
# the "Allow merge commits" default commit message setting must be
# configured to use the pull request title and description:
#   Settings > General > Pull Requests > Allow merge commits >
#   Default commit message > "Default to pull request title and
#   description"
# Left on its default, GitHub instead auto-generates the merge commit
# message from a list of the underlying commits being merged (in this
# repo's case, the full multi-paragraph changelog bodies of every
# "chore(release): x.y.z" commit since the last sync), and the carefully
# written body below never reaches develop's history even though it
# still satisfies pr-title-lint.yaml's check (which lints the PR's
# title+body directly, not whatever ends up in git history).
#
# The title + body below are pre-written to satisfy pr-title-lint.yaml's
# commitlint check (same .config/commitlint.config.mjs, run against
# title+body as one message) on the first open, rather than needing a
# manual edit every time:
#   - title: "chore(config): sync master into develop" - "config" is a
#     real entry in scope-enum, subject is lowercase and under 50 chars.
#   - body: sentence-case, >=10 chars, every line under 72.
#   - "References #1", not "Closes #1" - Closes is a GitHub auto-close
#     keyword, and issue #1 is meant to stay open forever as a running
#     log of every sync (every sync PR references the same #1; none of
#     them should ever close it). References links the PR into #1's
#     timeline without closing it, and still satisfies commitlint's
#     references-empty rule.
#   - Signed-off-by carries nmg-bot's own identity, not a human's - this
#     PR is genuinely bot-generated, no human wrote it, so a human DCO
#     signoff would misattribute authorship. The plain
#     "nmg-bot[bot]@users.noreply.github.com" form (rather than the
#     numeric-id form GitHub uses to attribute real commits/authorship,
#     e.g. "195387234+nmg-bot[bot]@users.noreply.github.com") is used
#     here because this trailer is just a DCO-style footer line, not tied
#     to real git authorship (the merge/PR itself is already
#     authenticated as nmg-bot via the App token elsewhere in this repo's
#     workflows) - and the numeric-id form runs long enough to risk
#     tripping footer-max-line-length (72, set in commitlint.config.mjs)
#     depending on how many digits nmg-bot's numeric id renders as. The
#     plain form stays comfortably under the limit regardless.
#
# The PR is opened with nmg-bot's own minted App token, not the default
# GITHUB_TOKEN: GitHub does not let the default GITHUB_TOKEN trigger
# further workflow runs (recursion prevention) - for
# pull_request opened/synchronize/reopened specifically, it doesn't skip
# the run outright, it creates the run and holds it in "Action required"
# pending manual approval forever. Minting the same App token here (as
# release.yaml already does) and passing it to github-script's
# `github-token:` input makes the PR's "opened" event authenticate as a
# real App installation, so pr-title-lint.yaml and branch-protection.yaml
# run immediately instead of sitting on a stuck approval every sync.

name: Sync Master to Develop

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mint nmg-bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open sync PR if one isn't already open
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'develop',
              head: `${context.repo.owner}:master`,
            });

            if (existing.length > 0) {
              core.info(`Sync PR already open: #${existing[0].number}`);
              return;
            }

            const body = [
              'Touched:',
              '',
              '- All',
              '',
              'Description:',
              '',
              '- Keeps master up-to-date to help prevent conflicts.',
              '',
              'References #1',
              '',
              'Signed-off-by: nmg-bot[bot] <nmg-bot[bot]@users.noreply.github.com>',
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore(config): sync master into develop',
              head: 'master',
              base: 'develop',
              body,
            });

            core.info(`Opened sync PR #${pr.data.number}`);
