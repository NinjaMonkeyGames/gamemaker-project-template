# Whenever master changes for any reason (a release/* merge, a hotfix/*
# merge, semantic-release's version-bump commit, or anything else), this
# opens a pull request bringing those changes into develop - so develop
# can't silently drift behind what's actually shipped, and nobody has to
# remember a manual "merge back into develop" step.
#
# This only ever opens the PR - it never merges it. A human still
# reviews and merges, same as everywhere else in this repo. Once a sync
# PR is open, there's nothing to "update" on later pushes to master: an
# open PR tracks the live diff between its base and head branches
# automatically (that's just how GitHub PRs work), so the existing PR
# already reflects new commits without this workflow touching it again.
#
# Merge this PR with a regular merge commit, not squash - same reasoning
# as release/* and hotfix/* merging back into develop (see
# CONTRIBUTING.md): this preserves history rather than collapsing it.
#
# The title + body below are pre-written to satisfy pr-title-lint.yaml's
# commitlint check (same .config/commitlint.config.mjs, run against
# title+body as one message) on the first open, instead of needing a
# manual edit every time - which is what was happening before this:
#   - title: "chore(config): sync master into develop" - "config" is a
#     real entry in scope-enum, subject is lowercase and under 50 chars.
#   - body: sentence-case, >=10 chars, every line under 72 - copied
#     verbatim from the manually-edited version that's already confirmed
#     to pass.
#   - "References #1", not "Closes #1" - Closes is a GitHub auto-close
#     keyword, and issue #1 is meant to stay open forever as a running
#     log of every sync (confirmed with the repo owner: every future
#     sync PR references the same #1, none of them should ever close
#     it). References links the PR into #1's timeline without closing
#     it, and still satisfies commitlint's references-empty rule -
#     confirmed locally with real commitlint against this exact message.
#   - Signed-off-by carries nmg-bot's own identity, not a human's - this
#     PR is genuinely bot-generated, no human wrote it, so a human DCO
#     signoff would misattribute authorship.
#
# CONFIRMED LIVE: the PR must be opened with nmg-bot's own minted App
# token, not the default GITHUB_TOKEN. GitHub does not let the default
# GITHUB_TOKEN trigger further workflow runs (recursion prevention) -
# for pull_request opened/synchronize/reopened specifically, it doesn't
# skip the run outright, it creates the run and holds it in "Action
# required" pending manual approval forever. Opening this PR with
# GITHUB_TOKEN (the actions/github-script default) left
# pr-title-lint.yaml and branch-protection.yaml stuck exactly like that
# on the PR's initial "opened" event - they only ran normally later, once
# nmg-bot's own follow-up push to master hit the PR as a "synchronize"
# event, because that push was authenticated with a real App installation
# token instead. Minting the same token here (as release.yaml already
# does) and passing it to github-script's `github-token:` input makes the
# "opened" event authenticate the same way, so both checks run
# immediately instead of sitting on a stuck approval every single sync.
#
# CONFIRMED LOCALLY (real commitlint + @commitlint/config-conventional,
# the custom signed-off-by-regex plugin stubbed since its exact regex has
# never been shared in this conversation - everything else is real):
# the natural bot line, "Signed-off-by: nmg-bot[bot]
# <195387234+nmg-bot[bot]@users.noreply.github.com>" (the numeric-id
# form GitHub actually uses to attribute real commits/authorship to a
# bot), is 77 characters and fails footer-max-line-length (72, set in
# commitlint.config.mjs) outright - and that failure would only show up
# the day nmg-bot's actual numeric id happened to be that long, i.e.
# possibly never during testing with a shorter placeholder. This trailer
# isn't tied to real git authorship (the merge/PR itself is already
# authenticated as nmg-bot via the App token elsewhere in this repo's
# workflows) - it's just a DCO-style footer line - so there's no need for
# the numeric-id form here at all. Using the plain
# "nmg-bot[bot]@users.noreply.github.com" form instead (67 characters)
# keeps it recognizably nmg-bot's own address, stays comfortably under
# the limit, and - unlike the numeric-id form - can't be pushed over 72
# later just because the id happens to render longer.

name: Sync Master to Develop

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mint nmg-bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open sync PR if one isn't already open
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'develop',
              head: `${context.repo.owner}:master`,
            });

            if (existing.length > 0) {
              core.info(`Sync PR already open: #${existing[0].number}`);
              return;
            }

            const body = [
              'Touched:',
              '',
              '- All',
              '',
              'Description:',
              '',
              '- Keeps master up-to-date to help prevent conflicts.',
              '',
              'References #1',
              '',
              'Signed-off-by: nmg-bot[bot] <nmg-bot[bot]@users.noreply.github.com>',
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore(config): sync master into develop',
              head: 'master',
              base: 'develop',
              body,
            });

            core.info(`Opened sync PR #${pr.data.number}`);