# Runs semantic-release on push to master/develop/release/*:
#   master     -> stable release
#   develop    -> beta prerelease
#   release/*  -> rc prerelease
# Config: .config/release.config.js (loaded via --extends, since
# semantic-release only auto-finds config at the repo root).
#
# Runs as nmg-bot (GitHub App token) because it needs actual write
# access: semantic-release's own auth check pushes a probe commit, and
# the version-bump + changelog commit pushes for real. nmg-bot must be
# a bypass actor on master/develop's "require PR" rule.
#
# The version-bump + changelog commit is Verified: release.config.js
# uses ./.config/verified-git-commit.plugin.cjs in place of
# @semantic-release/git. Plain `git push` - even authenticated as an
# App - never gets a Verified badge; only a commit GitHub creates
# itself via the Git Data API does, which is what that plugin calls
# instead of shelling out to git commit/push. No GPG/SSH key needed:
# GitHub signs it with its own key on nmg-bot's behalf. See that file's
# header comment for the full explanation. This step's `GITHUB_TOKEN`
# (the same nmg-bot app token used for checkout) is what the plugin
# authenticates the API calls with - no separate secret required.
#
# Note: hotfix/* is NOT included below and is NOT in release.config.js's
# `branches` array either - the two must stay in sync. If hotfix/*
# support is added later, add it in both places at once, not just here
# (semantic-release will otherwise run and immediately report "branch
# not configured" for any hotfix/* push, which is harmless noise but
# worth avoiding).
#
# CONFIRMED LIVE (and since REMOVED - see below): cutting release/*
# straight from develop's current tip used to inherit whatever
# commit-message suppression that tip commit carried; with "[skip ci]"
# in the message, GitHub skipped a push-triggered workflow run based on
# whatever commit the ref now pointed at, so a release/* branch's first
# push could silently run no release at all. The original fix was an
# `on: create` trigger, since `create` fires whenever a ref is made and,
# unlike `push`, isn't suppressible by commit message at all.
#
# That fix is gone now, on purpose. verified-git-commit.plugin.cjs's
# DEFAULT_MESSAGE stopped carrying "[skip ci]" a while back (see that
# file's header comment) - so the one problem `on: create` existed to
# solve no longer exists anywhere in this repo: a plain `push` now always
# fires, message content irrelevant, including a release/* branch's
# first push. Keeping `create` around after that stopped being true
# wasn't harmless leftover - it actively caused a NEW bug:
#
# CONFIRMED LIVE: cutting a release/* branch (an ordinary `git push` of a
# newly created branch, no separate commits) fires BOTH a `push` event
# and a `create` event for that same push - that's standard GitHub
# behavior for any new branch, not something specific to this repo.
# Both events matched this workflow's old `on:` block and both started a
# real run. The `concurrency.group` below was `release-${{ github.ref }}`
# to stop exactly this kind of double-run from racing - but `github.ref`
# is NOT populated the same way for a `create` event as it is for `push`:
# push resolves it to `refs/heads/release/<name>` as expected, but create
# does not (this is the same `github.ref` vs `github.ref_name` gap
# detect-environment.yaml already works around by using
# `github.head_ref || github.ref_name` instead of `github.ref` directly -
# this file just hadn't been updated to match). The two runs landed in
# DIFFERENT concurrency groups, so neither queued behind the other - both
# ran fully in parallel, both computed the same next version from the
# same starting point, and both tried to `git tag v<version>` the exact
# same tag. One won; the other failed outright with "fatal: tag
# 'v<version>' already exists" (exit 128) - a real release still shipped
# correctly from the run that won the race, but the loser's run shows as
# a failed job on every single release/* branch cut, forever.
#
# Fix: drop `create` entirely, now that it has no remaining job to do.
# A plain `push` trigger alone already covers a release/* branch's first
# push correctly (no more [skip ci] to dodge), so there's no longer a
# second event to race against, and no need to reconcile `github.ref`
# across two trigger types that no longer both need to exist here.
#
# The job's `if:` also skips ordinary pushes whose head commit was
# authored by nmg-bot - i.e. the bot's own previous version-bump commit
# landing as a push in its own right. Not a correctness requirement
# (commit-analyzer wouldn't classify a "chore(release): ..." commit as
# release-worthy anyway, under the conventionalcommits preset's default
# rules, so this would otherwise just cleanly no-op) - purely to avoid
# paying for a full npm ci + semantic-release invocation that can only
# ever conclude "nothing to release" against the exact commit it itself
# just created. NOT YET CONFIRMED LIVE: this assumes a commit created via
# the Git Data API with no custom author/committer (as
# verified-git-commit.plugin.cjs does) gets attributed to the App's bot
# login in the format "nmg-bot[bot]" - reasonably well-supported, but
# verify against a real run before trusting it for anything beyond "worst
# case, it fails open and still runs" (a mismatch just means this
# condition is never true, so the job runs every time rather than
# silently never running - the safe direction to get wrong).

name: Release

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'

# Prevents two releases on the same branch racing (e.g. a merge and
# sync-master-to-develop.yaml landing seconds apart). github.ref_name is
# used instead of github.ref on principle, even though this workflow now
# only has one trigger (push) so the two happen to agree today: github.ref
# is the context variable that silently stopped matching the triggering
# branch once `create` was a second trigger here (see the header comment
# above), and github.ref_name is the one detect-environment.yaml already
# relies on for exactly that reason. No reason to reach for the riskier
# one now that the safer one costs nothing extra.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.head_commit.author.username != 'nmg-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mint nmg-bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # A freshly minted token can be rejected on first use before it
      # propagates.
      - name: Wait for installation token to propagate
        run: sleep 5

      # Must run AFTER the token is minted, and must receive it directly
      # via `token:`. actions/checkout persists whatever credentials it's
      # given into .git/config for the rest of the job - if it runs first
      # with no token, it persists the default GITHUB_ACTIONS token
      # instead, and every later git push (including the one
      # semantic-release/git shells out to) authenticates as
      # github-actions[bot] rather than nmg-bot. That identity isn't a
      # bypass actor on master/develop's "require PR" rule, so the push
      # gets rejected even though the app token itself is minted fine.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release --extends ./.config/release.config.js