# Reusable workflow: the set of checks every feature/* branch must pass
# (the "preview" gate — see CONTRIBUTING.md / detect-environment.yaml).
# Called from deploy.yaml when the resolved environment is "preview".
#
# Add more jobs here as the preview gate grows (tests, build, lint, etc).
#
# merge_group support: also triggers directly (independent of deploy.yaml)
# when develop's Merge Queue processes a PR. Note this will report under
# a DIFFERENT check name than the "preview / commitlint" one produced via
# deploy.yaml's workflow_call - that naming comes specifically from being
# called as deploy.yaml's "preview" job, which a direct merge_group
# trigger bypasses. Rather than guess at the exact resulting name, verify
# it once triggered live and add it to develop's required-checks list as
# its own additional entry - it doesn't need to match the existing name.
#
# Like pr-title-lint.yaml, this deliberately does NOT try to replicate
# any branch-specific logic from the merge_group event - these checks
# aren't integration-sensitive (a commit message or markdown file's
# validity doesn't change based on what else is in the queue), so they
# were already conclusively answered by the push-triggered run. The
# merge_group run is a documented no-op reporting success, not a guess
# about the event's schema.
#
# CONFIRMED LIVE: every real step below is guarded with
# `if: github.event_name != 'merge_group'`, not
# `== 'workflow_call'`. github.event_name inside a workflow invoked via
# workflow_call reports the ORIGINAL triggering event of the top-level
# caller (e.g. "push", since that's what triggers deploy.yaml) - not
# "workflow_call" itself. The first version of this file used the wrong
# comparison and every step silently skipped on real pushes, caught only
# by actually testing a push to a feature branch and seeing every check
# come back skipped.

name: Preview Checks

on:
  workflow_call:
  merge_group:
    types: [checks_requested]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    # Declaring this environment is what makes GitHub record an actual
    # "preview" Deployment for this commit - required for a "Require
    # deployments to succeed: preview" branch protection rule to have
    # anything to check against. Without this, no job anywhere ever
    # creates a "preview" deployment (deploy.yaml's deploy job explicitly
    # skips itself when the environment is "preview"), so that rule would
    # fail on every PR, always, regardless of whether checks pass.
    #
    # NOTE: as of writing, "Require deployments to succeed: preview" was
    # tried and removed - it breaks GitHub's auto-merge feature outright.
    # See CONTRIBUTING.md. environment: preview is left in place since it
    # doesn't hurt anything and would matter again if that rule were ever
    # reintroduced some other way.
    environment: preview
    steps:
      - name: No-op for merge_group (see file header comment)
        if: github.event_name == 'merge_group'
        run: echo "Not integration-sensitive; already verified by the push-triggered run. Nothing to re-check here."

      # fetch-depth: 0 (full history, all branches) rather than 2 - finding
      # a merge-base for hotfix/* and release/* below needs real history,
      # not just the last couple of commits.
      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: github.event_name != 'merge_group'
        with:
          node-version: 24

      # Installs from package-lock.json so commitlint uses the repo's own
      # pinned commitlint + config-conventional versions, matching your
      # local install and pr-title-lint.yaml.
      - name: Install commitlint
        if: github.event_name != 'merge_group'
        run: npm ci

      - name: Print commitlint version
        if: github.event_name != 'merge_group'
        run: npx commitlint --version

      # feature/*: lints only the most recent commit (--last). Safe to
      # check just the tip here, even across a multi-commit push, because
      # feature/* -> develop is squash-merged - individual commits never
      # survive into develop's history anyway (see pr-title-lint.yaml,
      # which lints the PR title/body that actually lands there instead).
      #
      # This previously used wagoid/commitlint-github-action, which
      # reported "Lint free!" regardless of commit content. Root cause: the
      # config path was wrong (pointed at repo root, but the file actually
      # lives in .config/), so the action silently fell back to bare
      # @commitlint/config-conventional defaults - which a plain "feat: add
      # x" satisfies with no scope/body/signoff required. Using the
      # commitlint CLI directly surfaces a loud, explicit error on a wrong
      # config path instead of silently discarding your custom rules, and
      # matches the working pattern already used in pr-title-lint.yaml.
      - name: Lint last commit (feature/*)
        if: github.event_name != 'merge_group' && !startsWith(github.ref_name, 'hotfix/') && !startsWith(github.ref_name, 'release/')
        run: npx commitlint --config ./.config/commitlint.config.mjs --last

      # hotfix/* and release/* merge into master with a regular merge
      # commit (not squash - see CONTRIBUTING.md), so every individual
      # commit's message survives into master's permanent history. --last
      # only ever checks the single newest commit at push time: if a bad
      # commit is buried under a later good one in the same push, it
      # passes uncaught and its message reaches master unchecked. Linting
      # the full range since the branch forked closes that gap.
      #
      # hotfix/* forks from master, so master is the right base. release/*
      # forks from develop, NOT master - using master there would also
      # re-lint all of develop's own history that hasn't reached master
      # yet, which isn't this release branch's own work and isn't what's
      # being checked here.
      - name: Lint commit range (hotfix/*)
        if: github.event_name != 'merge_group' && startsWith(github.ref_name, 'hotfix/')
        run: npx commitlint --config ./.config/commitlint.config.mjs --from "$(git merge-base HEAD origin/master)" --to HEAD

      - name: Lint commit range (release/*)
        if: github.event_name != 'merge_group' && startsWith(github.ref_name, 'release/')
        run: npx commitlint --config ./.config/commitlint.config.mjs --from "$(git merge-base HEAD origin/develop)" --to HEAD

  markdownlint:
    # TEMPORARILY DISABLED - only commitlint and semantic-release are
    # meant to actively run right now; every other check in this file
    # (this job, cspell, gm-cli-tests) is disabled the same way and for
    # the same reason gm-cli-tests already was below. Kept as a real
    # (fast) job rather than deleted or job-level `if: false`'d, because
    # master's branch protection requires "preview / markdownlint" to
    # pass - skipping the job entirely means that check never gets
    # reported and PRs hang forever waiting on it (the exact bug this
    # whole preview.yaml setup already hit once with cspell). To
    # re-enable, restore the steps below from git history (this job's
    # previous, fully-working version) instead of rewriting it from
    # scratch.
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: markdownlint temporarily disabled
        run: echo "markdownlint is temporarily disabled - see the comment on this job in preview.yaml."

  cspell:
    # TEMPORARILY DISABLED - see markdownlint's comment above; same
    # reasoning applies here.
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - name: cspell temporarily disabled
        run: echo "cspell is temporarily disabled - see the comment on the markdownlint job in preview.yaml."

  gm-cli-tests:
    # TEMPORARILY DISABLED (again) - the container pull + compile + test
    # cycle is too slow to wait on while iterating on other parts of CI
    # (release.yaml, branch protection, etc). Kept as a real (fast) job
    # rather than deleted or job-level `if: false`'d, because master's
    # branch protection requires "preview / gm-cli-tests" to pass -
    # skipping the job entirely means that check never gets reported and
    # PRs hang forever waiting on it (the exact bug this whole preview.yaml
    # setup already hit once with cspell). To re-enable, restore the
    # container/steps below from git history (this job's previous,
    # fully-working version - compile + Xvfb + retry logic, proven
    # working, not a guess) instead of rewriting it from scratch.
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: gm-cli-tests temporarily disabled
        run: echo "gm-cli-tests is temporarily disabled for faster CI iteration - see the comment on this job in preview.yaml."